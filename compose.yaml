name: olympus
services:
  nodus-search:
    build: {context: ../nodus/deploy/search}
    restart: unless-stopped
    tmpfs:
      - /etc/searxng
      - /var/cache/searxng
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend, nodus-search-egress]

  postgres-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    shm_size: 256mb
    networks: [backend]

  mongo-db:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    networks: [backend]

  hermes:
    build: {context: ../hermes}
    env_file: [../hermes/.env]
    depends_on: [postgres-db, design-system]
    restart: unless-stopped
    networks: [backend, edge]

  intranet:
    build: {context: ../intranet}
    profiles: [dev]
    env_file: [../intranet/.env]
    depends_on: [postgres-db]
    restart: unless-stopped
    networks: [backend, edge]

  escuta:
    build: {context: ../escuta}
    env_file: [../escuta/.env]
    depends_on: [postgres-db]
    restart: unless-stopped
    networks: [backend, edge]

  chatrapido:
    build: {context: ../chatrapido}
    env_file: [../chatrapido/.env]
    depends_on: [postgres-db]
    volumes: [../chatrapido/storage:/rails/storage]
    restart: unless-stopped
    networks: [backend, edge]

  stagemanager:
    build: {context: ../stagemanager}
    env_file: [../stagemanager/.env]
    depends_on: [postgres-db]
    volumes: [../stagemanager/storage:/rails/storage]
    restart: unless-stopped
    networks: [backend, edge]

  dike:
    build: {context: ../dike}
    env_file: [../dike/.env]
    restart: unless-stopped
    networks: [edge]

  temis:
    build: {context: ../temis}
    env_file: [../temis/.env]
    restart: unless-stopped
    networks: [edge]

  prometheus-bot:
    build: {context: ../prometheus-bot}
    env_file: [../prometheus-bot/.env]
    depends_on: [mongo-db]
    restart: unless-stopped
    networks: [backend, edge]

  design-system:
    build: {context: ../design-system}
    env_file: [../design-system/.env]
    restart: unless-stopped
    networks: [edge]

  laras2026-website:
    env_file: [../laras2026-website/.env]
    restart: unless-stopped
    networks: [edge]

  cronos:
    build: {context: ../cronos}
    env_file: [../cronos/.env]
    restart: unless-stopped
    networks: [edge]

networks:
  nodus-search-egress: {}
  backend:
    internal: true
  edge: {}
volumes:
  postgres-data:
  mongo-data:
