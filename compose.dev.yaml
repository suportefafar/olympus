services:
  postgres-db:
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-db:
    ports:
      - "127.0.0.1:27017:27017"

  dike:
    ports:
      - "127.0.0.1:3002:3002"

  hermes:
    # Dev does not need the in-process mail worker; keeping it disabled lets
    # the web process stay available while mail delivery remains mocked.
    environment:
      SOLID_QUEUE_IN_PUMA: ""

  intranet:
    build:
      args:
        BUNDLE_WITHOUT_GROUPS: test
    environment:
      RAILS_ENV: development
      INTRANET_DATABASE_HOST: postgres-db
      INTRANET_DATABASE_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
      INTRANET_PUBLIC_BASE_URL: http://intranet-stage.farmacia.local
      HERMES_API_URL: http://hermes:80
    volumes:
      - ../intranet/storage:/rails/storage

  nodus-api:
    build:
      context: ../nodus
      dockerfile: Dockerfile.dev
    env_file: [../nodus/.env]
    environment:
      RAILS_ENV: development
      OLYMPUS_DEV: "1"
      DATABASE_URL: ""
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
      OPENROUTER_SITE_URL: https://nodus.farmacia.local
    command: ["bash", "-lc", "bundle exec rails db:prepare && exec bundle exec rails server -b 0.0.0.0 -p 3000"]
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ../nodus/app:/rails/app
      - ../nodus/config:/rails/config
      - ../nodus/db:/rails/db
      - ../nodus/lib:/rails/lib
      - ../nodus/log:/rails/log
      - ../nodus/storage:/rails/storage
    restart: unless-stopped
    networks: [backend, edge]

  nodus-client:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      VITE_API_BASE: /api
    command: ["sh", "-lc", "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0"]
    volumes:
      - ../nodus/client:/app
      - nodus-client-node-modules:/app/node_modules
    restart: unless-stopped
    networks: [edge]

  ciclum:
    build:
      context: ../ciclum
      dockerfile: Dockerfile.dev
    env_file: [../ciclum/.env]
    environment:
      RAILS_ENV: development
      BIND_ADDRESS: 0.0.0.0
      PORT: "3000"
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    command: ["bash", "-lc", "bundle exec rails db:prepare && exec bundle exec rails server"]
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ../ciclum/app:/rails/app
      - ../ciclum/config:/rails/config
      - ../ciclum/db:/rails/db
      - ../ciclum/lib:/rails/lib
      - ../ciclum/log:/rails/log
      - ../ciclum/storage:/rails/storage
    restart: unless-stopped
    networks: [backend, edge]

  mysql-db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER:-local-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-mysql-2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-mysql-root-2026}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]

  cronos:
    environment:
      # Caddy reaches Cronos through the isolated dev edge network.
      ALLOWED_NETWORKS: 172.24.0.0/16

  institutional-website:
    image: wordpress:php8.3-apache
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-local-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-local-mysql-2026}
      WORDPRESS_DB_NAME: institutional
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://farmacia.local' );
        define( 'WP_SITEURL', 'http://farmacia.local' );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
    volumes:
      - type: bind
        source: ../../services-infra/institutional-website/html
        target: /var/www/html
    networks: [backend, edge]

  intranet-website:
    image: wordpress:php8.3-apache
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-local-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-local-mysql-2026}
      WORDPRESS_DB_NAME: intranet
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://intranet.farmacia.local' );
        define( 'WP_SITEURL', 'http://intranet.farmacia.local' );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
    volumes:
      - type: bind
        source: ../../services-infra/intranet-website/html
        target: /var/www/html
    networks: [backend, edge]

  escuta-website-wp:
    image: wordpress:php8.3-apache
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-local-wp}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-local-mysql-2026}
      WORDPRESS_DB_NAME: escuta_wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://escuta-wp.farmacia.local' );
        define( 'WP_SITEURL', 'http://escuta-wp.farmacia.local' );
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
    volumes:
      - type: bind
        source: ../../services-infra/escuta-website-wp/html
        target: /var/www/html
    networks: [backend, edge]

  escuta-website:
    build:
      context: ../escuta-website
      dockerfile: Dockerfile.dev
    command:
      - bash
      - -lc
      - |
        npm run build:css
        npm run watch:css &
        css_pid=$$!
        trap 'kill "$$css_pid" 2>/dev/null || true' TERM INT EXIT
        exec ./bin/thrust ./bin/rails server
    volumes:
      - type: bind
        source: ../escuta-website/app
        target: /rails/app
      - type: bind
        source: ../escuta-website/config
        target: /rails/config
      - type: bind
        source: ../escuta-website/lib
        target: /rails/lib
      - type: bind
        source: ../escuta-website/public
        target: /rails/public

  reverse-proxy:
    build:
      context: ../reverse-proxy
      dockerfile: Dockerfile
    environment:
      CADDY_ENVIRONMENT: development
      DOMAIN_SUFFIX: local
    depends_on:
      - institutional-website
      - intranet-website
      - intranet
      - escuta-website-wp
      - nodus-api
      - nodus-client
      - ciclum
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro

volumes:
  mysql-data:
  nodus-client-node-modules:
