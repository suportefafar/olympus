services:
  mysql-db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in olympus/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]

  institutional-website:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: institutional
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INSTITUTIONAL_PATH:?Set WORDPRESS_INSTITUTIONAL_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  intranet-website:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: intranet
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INTRANET_PATH:?Set WORDPRESS_INTRANET_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  escuta-website-wp:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: escuta_wp
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_ESCUTA_PATH:?Set WORDPRESS_ESCUTA_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  laras2026-website:
    image: olympus-laras2026-website
    build: {context: ../laras2026-website}
    volumes: !reset []

  cronos:
    ports:
      - "10.10.10.1:123:123/udp"
    environment:
      ALLOWED_NETWORKS: ${CRONOS_ALLOWED_NETWORKS:?Set CRONOS_ALLOWED_NETWORKS in olympus/.env}

  escuta-website:
    volumes:
      - ../escuta-website/storage:/rails/storage

  hermes:
    volumes:
      - ../hermes/storage:/rails/storage

  intranet:
    environment:
      INTRANET_DATABASE_HOST: postgres-db
      INTRANET_DATABASE_PORT: "5432"
    volumes:
      - ../intranet/storage:/rails/storage

  reverse-proxy:
    environment:
      CADDY_ENVIRONMENT: production
      DOMAIN_SUFFIX: ufmg.br
    depends_on:
      - institutional-website
      - intranet-website
      - intranet
      - escuta-website-wp
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${TLS_CERTS_PATH:?Set TLS_CERTS_PATH in olympus/.env}
        target: /etc/ssl/certs/farmacia
        read_only: true

volumes:
  mysql-data:
