services:
  nodus-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_graph_chat
      POSTGRES_PASSWORD: ${NODUS_DATABASE_PASSWORD:?Set NODUS_DATABASE_PASSWORD in olympus/.env}
      POSTGRES_DB: ai_graph_chat_production
    volumes:
      - nodus-postgres-data:/var/lib/postgresql/data
      - ../nodus/deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-create-extra-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_graph_chat -d ai_graph_chat_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  nodus-api:
    build: {context: ../nodus}
    env_file: [../nodus/.env.production]
    volumes:
      - nodus-storage:/rails/storage
    environment:
      RAILS_ENV: production
      DB_HOST: nodus-db
      RAILS_MAX_THREADS: 3
      SOLID_QUEUE_IN_PUMA: "true"
      NODUS_DATABASE_PASSWORD: ${NODUS_DATABASE_PASSWORD:?Set NODUS_DATABASE_PASSWORD in olympus/.env}
      FRONTEND_ORIGIN: https://nodus.farmacia.ufmg.br
    depends_on:
      nodus-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, edge]

  nodus-client:
    build:
      context: ../nodus
      dockerfile: Dockerfile.client
      args:
        VITE_API_BASE: /api
    depends_on:
      design-system:
        condition: service_started
    restart: unless-stopped
    networks: [edge]

  ciclum:
    build: {context: ../ciclum}
    env_file: [../ciclum/.env.production]
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 3
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      - ciclum-storage:/rails/storage
    depends_on:
      design-system:
        condition: service_started
    restart: unless-stopped
    networks: [edge]

  mysql-db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in olympus/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]

  institutional-website:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: institutional
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INSTITUTIONAL_PATH:?Set WORDPRESS_INSTITUTIONAL_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  intranet-website:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: intranet
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INTRANET_PATH:?Set WORDPRESS_INTRANET_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  escuta-website-wp:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: escuta_wp
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_ESCUTA_PATH:?Set WORDPRESS_ESCUTA_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  laras2026-website:
    image: olympus-laras2026-website
    build: {context: ../laras2026-website}
    volumes: !reset []

  cronos:
    ports:
      - "10.10.10.1:123:123/udp"
    environment:
      ALLOWED_NETWORKS: ${CRONOS_ALLOWED_NETWORKS:?Set CRONOS_ALLOWED_NETWORKS in olympus/.env}

  escuta-website:
    volumes:
      - ../escuta-website/storage:/rails/storage

  hermes:
    volumes:
      - ../hermes/storage:/rails/storage

volumes:
  nodus-postgres-data:
  ciclum-storage:
  nodus-storage:
  mysql-data:
