services:
  postgres-db:
    image: olympus-postgres-pgvector:17
    build: {context: ./postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  nodus-api:
    build: {context: ../nodus}
    env_file: [../nodus/.env.production]
    volumes:
      - nodus-storage:/rails/storage
    environment:
      RAILS_ENV: production
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
      RAILS_MAX_THREADS: 3
      FRONTEND_ORIGIN: https://nodus.farmacia.ufmg.br
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, edge]

  athenas: &athenas-app
    image: olympus-athenas
    build: {context: ../athenas}
    env_file: [../athenas/.env]
    environment: &athenas-environment
      RAILS_ENV: production
      RAILS_MAX_THREADS: 3
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
      APP_BASE_URL: https://athenas.farmacia.ufmg.br
      HERMES_API_URL: http://hermes:80
      OLLAMA_BASE_URL: http://athenas-ollama:11434
      JOB_CONCURRENCY: "1"
    volumes:
      - athenas-production-storage:/rails/storage
    depends_on:
      postgres-db:
        condition: service_healthy
      athenas-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    networks: [backend, edge]

  athenas-worker:
    <<: *athenas-app
    command: ["bin/jobs"]
    depends_on:
      postgres-db:
        condition: service_healthy
      athenas-setup:
        condition: service_completed_successfully
      athenas-model-setup:
        condition: service_completed_successfully
    networks: [backend]
    mem_limit: 2g
    cpus: 2

  athenas-setup:
    <<: *athenas-app
    command: ["bin/olympus-setup"]
    labels:
      olympus.lifecycle: oneshot
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  athenas-ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    volumes: [athenas-production-ollama-data:/root/.ollama]
    mem_limit: 2g
    cpus: 2
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  athenas-model-setup:
    image: ollama/ollama:0.13.5
    env_file: [../athenas/.env]
    environment:
      OLLAMA_HOST: http://athenas-ollama:11434
    entrypoint: ["sh", "-c", "model=$${EMBEDDING_MODEL:-bge-m3}; ollama show \"$$model\" >/dev/null 2>&1 || exec ollama pull \"$$model\""]
    command: []
    labels:
      olympus.lifecycle: oneshot
    depends_on:
      athenas-ollama:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  nodus-client:
    build:
      context: ../nodus
      dockerfile: Dockerfile.client
      args:
        VITE_API_BASE: /api
    depends_on:
      design-system:
        condition: service_started
    restart: unless-stopped
    networks: [edge]

  ciclum:
    build: {context: ../ciclum}
    env_file: [../ciclum/.env.production]
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 3
      SOLID_QUEUE_IN_PUMA: "true"
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    volumes:
      - ciclum-storage:/rails/storage
    depends_on:
      postgres-db:
        condition: service_healthy
      design-system:
        condition: service_started
    restart: unless-stopped
    networks: [backend, edge]

  mysql-db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in olympus/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]

  institutional-website:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: institutional
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INSTITUTIONAL_PATH:?Set WORDPRESS_INSTITUTIONAL_PATH in olympus/.env}
        target: /var/www/html
    networks: [backend, edge]

  intranet-website:
    image: wordpress:php8.3-apache
    command:
      - /bin/sh
      - -ec
      - php /opt/intranet-download/prepare.php; exec docker-entrypoint.sh apache2-foreground
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: intranet
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INTRANET_PATH:?Set WORDPRESS_INTRANET_PATH in olympus/.env}
        target: /var/www/html
      - ./wordpress/prepare-intranet-download.php:/opt/intranet-download/prepare.php:ro
      - ./wordpress/intranet-backup-download.php:/var/www/html/wp-content/mu-plugins/intranet-backup-download.php:ro
    networks: [backend, edge]

  laras2026-website:
    image: olympus-laras2026-website
    build: {context: ../laras2026-website}
    volumes: !reset []

  cronos:
    ports:
      - "10.10.10.1:123:123/udp"
    environment:
      ALLOWED_NETWORKS: ${CRONOS_ALLOWED_NETWORKS:?Set CRONOS_ALLOWED_NETWORKS in olympus/.env}

  escuta:
    volumes:
      - ../escuta/storage:/rails/storage

  hermes:
    environment:
      RAILS_ENV: production
      PORT: "80"
      RAILS_MAX_THREADS: 3
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    volumes:
      - ../hermes/storage:/rails/storage

volumes:
  ciclum-storage:
  athenas-production-storage:
  athenas-production-ollama-data:
  nodus-storage:
  mysql-data:
