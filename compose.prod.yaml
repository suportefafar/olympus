x-intranet-environment: &intranet-environment
  RAILS_ENV: production
  RAILS_MAX_THREADS: "3"
  WP_SYNC_RESERVE_NATIVE_TICKET_NUMBERS: "true"
  INTRANET_PUBLIC_BASE_URL: https://intranet-stage.farmacia.ufmg.br
  CLAMAV_COMMAND: /rails/bin/scan-upload

x-intranet-app: &intranet-app
  image: olympus-intranet
  build: {context: ../intranet}
  env_file: [../intranet/.env]
  environment: *intranet-environment
  volumes:
    - intranet-storage:/rails/storage
  restart: unless-stopped
  init: true

services:
  intranet:
    <<: *intranet-app
    profiles: !reset []
    depends_on:
      postgres-db:
        condition: service_healthy
      intranet-setup:
        condition: service_completed_successfully
      intranet-antivirus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/up"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: 2g

  intranet-worker:
    <<: *intranet-app
    command: ["./bin/jobs"]
    environment:
      <<: *intranet-environment
      RAILS_MAX_THREADS: "8"
      SOLID_QUEUE_SKIP_RECURRING: "false"
      SOLID_QUEUE_RECURRING_SCHEDULE: config/recurring_stage.yml
    depends_on:
      intranet-setup:
        condition: service_completed_successfully
      intranet-antivirus:
        condition: service_healthy
    networks: [backend, edge]
    mem_limit: 1g

  wordpress-sync:
    <<: *intranet-app
    command: ["./bin/wordpress-sync"]
    environment:
      <<: *intranet-environment
      WP_SYNC_WORDPRESS_PATH: /wordpress
      WP_SYNC_INVENTORY_ENABLED: "false"
    volumes:
      - intranet-storage:/rails/storage
      - type: bind
        source: ${WORDPRESS_INTRANET_PATH:?Set WORDPRESS_INTRANET_PATH in olympus/.env}
        target: /wordpress
        read_only: true
    depends_on:
      intranet-setup:
        condition: service_completed_successfully
      intranet-antivirus:
        condition: service_healthy
      intranet-website:
        condition: service_started
    networks: [backend]
    stop_grace_period: 45s
    mem_limit: 2g

  intranet-setup:
    <<: *intranet-app
    command: ["./bin/olympus-setup"]
    environment:
      <<: *intranet-environment
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    depends_on:
      postgres-db:
        condition: service_healthy
      mysql-db:
        condition: service_started
    labels:
      olympus.lifecycle: oneshot
    restart: "no"
    networks: [backend]

  intranet-antivirus:
    image: olympus-intranet
    build: {context: ../intranet}
    command: ["./bin/update-virus-definitions"]
    volumes:
      - intranet-storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "(test -s /rails/storage/clamav/main.cvd || test -s /rails/storage/clamav/main.cld) && (test -s /rails/storage/clamav/daily.cvd || test -s /rails/storage/clamav/daily.cld)"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 60
    restart: unless-stopped
    init: true
    networks: [edge]
    mem_limit: 2g

  postgres-db:
    image: olympus-postgres-pgvector:17
    build: {context: ./postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  nodus-api:
    build: {context: ../nodus}
    env_file: [../nodus/.env.production]
    volumes:
      - nodus-storage:/rails/storage
    environment:
      RAILS_ENV: production
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
      RAILS_MAX_THREADS: 3
      FRONTEND_ORIGIN: https://nodus.farmacia.ufmg.br
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, edge]

  athenas: &athenas-app
    image: olympus-athenas
    build: {context: ../athenas}
    mem_limit: 2g
    env_file: [../athenas/.env]
    environment: &athenas-environment
      RAILS_ENV: production
      RAILS_MAX_THREADS: 3
      ADMIN_EMAIL: suporte@farmacia.ufmg.br
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
      APP_BASE_URL: https://athenas.farmacia.ufmg.br
      HERMES_API_URL: http://hermes:80
      OLLAMA_BASE_URL: http://athenas-ollama:11434
      JOB_CONCURRENCY: "1"
    volumes:
      - athenas-production-storage:/rails/storage
    depends_on:
      postgres-db:
        condition: service_healthy
      athenas-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    networks: [backend, edge]

  athenas-worker:
    <<: *athenas-app
    command: ["bin/jobs"]
    depends_on:
      postgres-db:
        condition: service_healthy
      athenas-setup:
        condition: service_completed_successfully
      athenas-model-setup:
        condition: service_completed_successfully
    networks: [backend]
    mem_limit: 4g
    cpus: 3

  athenas-setup:
    <<: *athenas-app
    command: ["bin/olympus-setup"]
    labels:
      olympus.lifecycle: oneshot
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  athenas-ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    volumes: [athenas-production-ollama-data:/root/.ollama]
    mem_limit: 4g
    cpus: 3
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  athenas-model-setup:
    image: ollama/ollama:0.13.5
    env_file: [../athenas/.env]
    environment:
      OLLAMA_HOST: http://athenas-ollama:11434
    entrypoint: ["sh", "-c", "model=$${EMBEDDING_MODEL:-bge-m3}; ollama show \"$$model\" >/dev/null 2>&1 || exec ollama pull \"$$model\""]
    command: []
    labels:
      olympus.lifecycle: oneshot
    depends_on:
      athenas-ollama:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  nodus-client:
    build:
      context: ../nodus
      dockerfile: Dockerfile.client
      args:
        VITE_API_BASE: /api
    depends_on:
      design-system:
        condition: service_started
    restart: unless-stopped
    networks: [edge]

  ciclum:
    build: {context: ../ciclum}
    env_file: [../ciclum/.env.production]
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 3
      SOLID_QUEUE_IN_PUMA: "true"
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    volumes:
      - ciclum-storage:/rails/storage
    depends_on:
      postgres-db:
        condition: service_healthy
      design-system:
        condition: service_started
    restart: unless-stopped
    networks: [backend, edge]

  mysql-db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in olympus/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]

  institutional-website:
    image: olympus-wordpress-php8.3.36
    build:
      context: ./wordpress
      dockerfile: Dockerfile.php8.3.36
    command: ["/bin/sh", "-ec", "php /opt/fafar/prepare-security.php; exec docker-entrypoint.sh apache2-foreground"]
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      FAFAR_SECURITY_RELEASE: "2026-10-29.3"
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: institutional
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INSTITUTIONAL_PATH:?Set WORDPRESS_INSTITUTIONAL_PATH in olympus/.env}
        target: /var/www/html
      - type: bind
        source: ${FAFAR_INSTITUTIONAL_PLUGIN_PATH:?olymctl must prepare institutional components}
        target: /var/www/html/wp-content/plugins/fafar-cf7crud
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FAFAR_INSTITUTIONAL_THEME_PATH:?olymctl must prepare institutional components}
        target: /var/www/html/wp-content/themes/institutional-astra-child-theme
        read_only: true
        bind: {create_host_path: false}
      - ./wordpress/prepare-institutional-security.php:/opt/fafar/prepare-security.php:ro
      - ./wordpress/institutional-security.php:/var/www/html/wp-content/mu-plugins/fafar-institutional-security.php:ro
      - ./wordpress/intranet-backup-download.php:/var/www/html/wp-content/mu-plugins/fafar-backup-download.php:ro
      - ./wordpress/institutional-uploads.conf:/etc/apache2/conf-enabled/fafar-institutional-uploads.conf:ro
    networks: [backend, edge]

  intranet-website:
    image: olympus-wordpress-php8.3.36
    build:
      context: ./wordpress
      dockerfile: Dockerfile.php8.3.36
    command:
      - /bin/sh
      - -ec
      - php /opt/intranet-download/prepare.php; exec docker-entrypoint.sh apache2-foreground
    restart: unless-stopped
    depends_on: [mysql-db]
    environment:
      INTRANET_SHARED_TICKET_NUMBERS: "true"
      WORDPRESS_DB_HOST: mysql-db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in olympus/.env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in olympus/.env}
      WORDPRESS_DB_NAME: intranet
      WORDPRESS_DEBUG: "0"
    volumes:
      - type: bind
        source: ${WORDPRESS_INTRANET_PATH:?Set WORDPRESS_INTRANET_PATH in olympus/.env}
        target: /var/www/html
      - ../intranet/deploy/wordpress-sync-import.php:/var/www/html/wp-content/mu-plugins/intranet-wordpress-sync.php:ro
      - ../intranet/deploy/wordpress-ticket-number-reservations.php:/var/www/html/wp-content/mu-plugins/intranet-ticket-number-reservations.php:ro
      - ./wordpress/prepare-intranet-download.php:/opt/intranet-download/prepare.php:ro
      - ./wordpress/intranet-backup-download.php:/var/www/html/wp-content/mu-plugins/intranet-backup-download.php:ro
    networks: [backend, edge]

  laras2026-website:
    image: olympus-laras2026-website
    build: {context: ../laras2026-website}
    volumes: !reset []

  cronos:
    ports:
      - "10.10.10.1:123:123/udp"
    environment:
      ALLOWED_NETWORKS: ${CRONOS_ALLOWED_NETWORKS:?Set CRONOS_ALLOWED_NETWORKS in olympus/.env}

  escuta:
    volumes:
      - ../escuta/storage:/rails/storage

  hermes:
    environment:
      RAILS_ENV: production
      PORT: "80"
      RAILS_MAX_THREADS: 3
      DB_POOL: "8"
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in olympus/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in olympus/.env}
    volumes:
      - ../hermes/storage:/rails/storage

volumes:
  intranet-storage:
  ciclum-storage:
  athenas-production-storage:
  athenas-production-ollama-data:
  nodus-storage:
  mysql-data:
